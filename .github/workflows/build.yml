name: Build StaffPanel

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build --no-daemon

      - name: Inspect built mod JAR
        run: |
          ls -lh build/libs/
          jar tf build/libs/staffpanel-*.jar

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: staffpanel-jar
          path: build/libs/staffpanel-[0-9]*.jar
          if-no-files-found: error
